[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Console output settings
addopts = -v --tb=short --color=yes -ra

# Markers
markers =
    asyncio: mark a test as an async test
    slow: marks tests as slow (deselect with '-m "not slow"')
