# GitHub Actions CI/CD Pipeline
# ==============================
# Alternative to Jenkins — runs automatically on every push/PR.
# This is the modern equivalent used by most companies.

name: QA Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Job 1: Smoke Tests (Quick Gate) ──────────────
  smoke-tests:
    runs-on: ubuntu-latest
    name: "🔥 Smoke Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      
      - name: Run Smoke Tests
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pytest tests/test_11_smoke.py -v --tb=short

  # ─── Job 2: Unit Tests ───────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: smoke-tests
    name: "🧪 Unit Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      
      - name: Run Unit Tests
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pytest tests/test_04_technical_indicators.py tests/test_06_auth_database.py tests/test_07_news_sentiment.py -v --tb=short

  # ─── Job 3: Integration Tests ────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: smoke-tests
    name: "🔗 Integration Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      
      - name: Run Integration Tests
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pytest tests/test_01_health.py tests/test_02_auth.py tests/test_03_chat.py tests/test_05_market_data.py -v --tb=short

  # ─── Job 4: Security Tests ──────────────────────
  security-tests:
    runs-on: ubuntu-latest
    needs: smoke-tests
    name: "🔒 Security Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      
      - name: Run Security Tests
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pytest tests/test_09_security.py -v --tb=short

  # ─── Job 5: Black Box Tests ─────────────────────
  blackbox-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    name: "📦 Black Box Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      
      - name: Run Black Box Tests
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pytest tests/test_08_blackbox.py -v --tb=short

  # ─── Job 6: Performance Tests ───────────────────
  performance-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    name: "⚡ Performance Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      
      - name: Run Performance Tests
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pytest tests/test_10_performance.py -v --tb=short

  # ─── Job 7: E2E Tests ──────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [blackbox-tests, security-tests]
    name: "🌐 E2E Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      
      - name: Run E2E Tests
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pytest tests/test_13_e2e.py -v --tb=short

  # ─── Job 8: Regression Tests ────────────────────
  regression-tests:
    runs-on: ubuntu-latest
    needs: [blackbox-tests]
    name: "🔄 Regression Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      
      - name: Run Regression Tests
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pytest tests/test_12_regression.py -v --tb=short

  # ─── Job 9: Frontend Tests ─────────────────────
  frontend-tests:
    runs-on: ubuntu-latest
    needs: smoke-tests
    name: "⚛️ Frontend Tests"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      
      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npx react-scripts test --watchAll=false --ci --coverage

  # ─── Job 10: Code Coverage Report ──────────────
  coverage-report:
    runs-on: ubuntu-latest
    needs: [e2e-tests, regression-tests, performance-tests, frontend-tests]
    name: "📊 Coverage Report"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest-cov
      
      - name: Generate Coverage Report
        working-directory: ./backend
        run: |
          source venv/bin/activate
          python -m pytest tests/ -v --cov=. --cov-report=html --cov-report=term-missing
      
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
